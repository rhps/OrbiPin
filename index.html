<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OrbiPin</title>
  <style>
    body { margin: 0; background: #060a12; color: #dbe4f0; font-family: system-ui, sans-serif; }
    #root { position: absolute; inset: 0; }
  </style>
  <style>
    #orbipin-splash {
      position: fixed; inset: 0; z-index: 9999;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: #060a12; /* space navy — no white flash */
      height: 100dvh;
      transition: opacity 300ms ease-out;
      font-family: "Inter", system-ui, sans-serif;
    }
    #orbipin-splash.out { opacity: 0; pointer-events: none; }
    .spl-wordmark { color: #dbe4f0; font-weight: 700; font-size: 28px; letter-spacing: 0.02em; }
    .spl-tagline { color: #9db0cc; font-size: 13px; margin-top: 10px; }
    .spl-hourglass { margin-top: 28px; animation: spl-rock 1.6s ease-in-out infinite; }
    .spl-error { margin-top: 14px; color: #9db0cc; font-size: 12px; }
    .spl-error button { margin-left: 8px; color: #7fb4ff; background: none; border: 1px solid #24344f; border-radius: 999px; padding: 3px 10px; cursor: pointer; }
    @keyframes spl-rock {
      0%, 100% { transform: rotate(-12deg); opacity: 0.85; }
      50% { transform: rotate(12deg); opacity: 1; }
    }
    @media (prefers-reduced-motion: reduce) {
      .spl-hourglass { animation: none; }
    }
  </style>
</head>
<body>
  <div id="root"></div>
  <!-- branded splash: part of initial HTML so it paints before any JS bundle -->
  <div id="orbipin-splash" aria-label="Loading OrbiPin">
    <div class="spl-wordmark">OrbiPin</div>
    <div class="spl-tagline">Every event, a pin on the planet.</div>
    <img class="spl-hourglass" src="/icons/hourglass.png" alt="" width="38" height="38" />
  </div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
